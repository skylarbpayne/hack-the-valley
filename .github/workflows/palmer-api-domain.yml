name: Attach Palmer HTV API domain
on:
  workflow_dispatch:
    inputs:
      identify_only:
        description: Verify deployment token identity without attaching a hostname
        type: boolean
        default: true
permissions: {}
concurrency: palmer-htv-domain
jobs:
  attach:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Identify Cloudflare deployment token (read only)
        if: inputs.identify_only
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: python
        run: |
          import json, os, re, urllib.request
          from urllib.error import HTTPError
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args): return None
          opener = urllib.request.build_opener(NoRedirect())
          account = os.environ['ACCOUNT']
          if not re.fullmatch('[0-9a-f]{32}', account): raise SystemExit('Invalid account ID')
          matches = []
          for owner, scope in [('account', 'accounts/' + account), ('user', 'user')]:
              req = urllib.request.Request('https://api.cloudflare.com/client/v4/' + scope + '/tokens/verify',
                                           headers={'Authorization': 'Bearer ' + os.environ['CF_TOKEN']}, method='GET')
              try:
                  with opener.open(req, timeout=15) as response: data = json.load(response)
                  result = data['result']
                  if (data['success'] is not True or result['status'] != 'active' or
                      not re.fullmatch('[0-9a-f]{32}', result['id'])): raise ValueError()
                  matches.append((owner, result['id']))
              except HTTPError as err:
                  if err.code not in (401, 403): raise SystemExit('Identity lookup inconclusive') from None
              except Exception:
                  raise SystemExit('Identity lookup inconclusive') from None
          if len(matches) != 1: raise SystemExit('No unique verified token identity')
          print('owner=%s id=%s' % matches[0])
      - name: Verify dedicated Access app, attach only its hostname, read back
        if: github.event.inputs.identify_only == 'false'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: python
        run: |
          import json, os, urllib.request
          from urllib.error import HTTPError
          a = os.environ['ACCOUNT']; h = 'palmer.hackthevalley.org'
          z = '4e4f619bcf8df33371c5805d8bbb923b'; service = 'hack-the-valley'
          app = '/access/apps/93361360-fbaa-447f-bdcc-7d14f2da2d60'
          def api(path, body=None):
              req = urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/'+a+path, headers={'Authorization':'Bearer '+os.environ['CF_TOKEN'],'Content-Type':'application/json'}, method='GET' if body is None else 'PUT', data=None if body is None else json.dumps(body).encode())
              try:
                  with urllib.request.urlopen(req) as r: result=json.load(r)
              except HTTPError as e:
                  raise SystemExit(f'Cloudflare HTTP {e.code} on {path}') from None
              if not result['success']: raise SystemExit('Cloudflare rejected '+path)
              return result['result']
          access=api(app)
          if access['domain'] != h or access['type'] != 'self_hosted' or access.get('policies') or api(app+'/policies'): raise SystemExit('Expected empty whole-host Access app')
          target={'hostname':h,'service':service,'zone_id':z,'environment':'production'}
          def matches(rows): return len(rows)==1 and all(rows[0].get(k)==v for k,v in target.items()) and rows[0].get('enabled') is not False
          path='/workers/domains'; rows=api(path+'?hostname='+h)
          if not rows: api(path,target)
          elif not matches(rows): raise SystemExit('Existing domain conflicts; not modifying')
          rows=api(path+'?hostname='+h)
          if not matches(rows): raise SystemExit('Domain not verified')
          print('Attached', h, 'to', service, 'domain ID', rows[0]['id'])
