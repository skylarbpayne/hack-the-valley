<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event operations · Hack the Valley</title><style>
:root{font-family:system-ui,sans-serif;color:#e7f3f7;background:#0c1628}body{max-width:1000px;margin:auto;padding:1.5rem}a{color:#60d9ea}main{display:grid;gap:1rem}section{background:#17243a;border:1px solid #365067;border-radius:14px;padding:1.2rem}form{display:grid;gap:.7rem}label{display:grid;gap:.2rem}input,textarea,select,button{font:inherit;padding:.65rem;border-radius:8px}input,textarea,select{background:#0c1628;color:white;border:1px solid #718595}button{background:#57cfe0;color:#071b27;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.muted{color:#abc0cc}#status{min-height:2rem}#roster{max-height:320px;overflow:auto}article{padding:.65rem;border-bottom:1px solid #365067}small{display:block}
</style></head><body><header><a href="/">← Hack the Valley</a> · <a href="/shared-logins/">Shared logins</a> <a id="full-admin-link" href="/admin" hidden>· Full admin</a><h1>Event operations</h1><p class="muted">Event updates, check-in, and photo uploads. Content, email, roles and all-user records are not available to event organizers.</p></header><p id="status" role="status">Checking access…</p><main id="workspace" hidden><section><label>Event <select id="event"></select></label><label>Event date / instance <select id="instance-select"></select></label><p id="instance" class="muted"></p></section><section><h2>Update event</h2><form id="update"><label>Title <input name="title" required></label><label>Description <textarea name="description" rows="3"></textarea></label><label>Status <select name="status"><option>draft</option><option>open</option><option>closed</option><option>archived</option></select></label><label>Starts at <input name="starts_at" type="datetime-local"></label><label>Ends at <input name="ends_at" type="datetime-local"></label><label>Venue <input name="venue_name"></label><button>Save event</button></form></section><section><h2>Check-in</h2><form id="search" class="row"><input name="query" placeholder="Search name or email" aria-label="Search attendee" required><button>Search signups</button></form><div id="roster"></div></section><section><h2>Event photos</h2><form id="upload"><label>Photo <input type="file" name="photo" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" required></label><button>Upload photo</button></form><div id="photos"></div></section></main><script type="module" src="/organizer.js"></script></body></html>
